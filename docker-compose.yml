# Despliegue local de prueba con el mismo esquema de Dokploy:
#   app (API + frontend) + postgres separado.
#
#   docker compose up --build
#   → app en http://localhost:8080

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aft
      POSTGRES_PASSWORD: aft_cmg_secreto
      POSTGRES_DB: aft_cmg
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aft -d aft_cmg"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: aft
      PGPASSWORD: aft_cmg_secreto
      PGDATABASE: aft_cmg
      JWT_SECRET: dev-secreto-local-cambiar
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      PORT: 8080
    ports:
      - "8080:8080"

volumes:
  pgdata: